# ═══════════════════════════════════════════════════════════════
# META.yaml — Charm Bulk THnSparse metadata
# ═══════════════════════════════════════════════════════════════
# Each entry under `thns` defines a named THnSparse histogram
# configuration.  The `default` key selects which method is
# returned by CharmBulkInfo.default().
#
# Users / sub-workflows can add custom methods here, and they
# will be automatically picked up by CharmBulkInfo.method().
# ═══════════════════════════════════════════════════════════════

default: charm_bulk

thns:
  # ─── task charm-bulk ─────────────────────────────────────────────────────────────────
  charm_bulk:
    name: CharmBulk
    aliname: [charmbulk, CharmBulk]
    cand: ["D0"]
    description: "hCharmBulkCorrelations — 10 axes (inv mass, centrality, pT, sign, etc.)"
    datatype: "DATA"
    thname: hCharmBulkCorrelations
    thpath: hf-task-pt-fluc-charm-hadrons
    axes:
      - id: 0
        name: Inv. mass
      - id: 1
        name: Centrality
      - id: 2
        name: pT
      - id: 3
        name: Sign
      - id: 4
        name: Bkg score
      - id: 5
        name: FD score
      - id: 6
        name: Eta
      - id: 7
        name: Mean pT A
      - id: 8
        name: Mean pT B
      - id: 9
        name: pt product
    pre_axisids: [0, 1, 2, 4, 5, 6, 7, 8, 9]
    pre_thname: hSparseCharmBulk
    pre_thpath: CharmBulk

  bulk:
    name: Bulk
    aliname: [Bulk]
    cand: ["D0"]
    description: "hMeanPtTrkAllColls — 6 axes (centrality, mean pT, N tracks)"
    datatype: "DATA"
    thname: hMeanPtTrkAllColls
    thpath: hf-task-pt-fluc-charm-hadrons
    axes:
      - id: 0
        name: Centrality
      - id: 1
        name: Mean pT A
      - id: 2
        name: Mean pT B
      - id: 3
        name: mean pT product
      - id: 4
        name: N_tracks A
      - id: 5
        name: N_tracks B
    pre_axisids: [0, 1, 2, 3, 4, 5]
    pre_thname: hSparseBulk
    pre_thpath: CharmBulk

  # ─── task D0 ─────────────────────────────────────────────────────────────────
  # ----- Gen -------------------------------------------------------------------
  D0GenBase: &D0GenBase
    name: D0Gen
    aliname: ["D0Gen"]
    cand: ["D0"]
    description: "hSparseAcc — 6 axes"
    datatype: "MC"
    thname: hSparseAcc
    thpath: hf-task-d0
    axes:
      - id: 0
        name: pT
      - id: 1
        name: pT B
      - id: 2
        name: y
      - id: 3
        name: Origin
      - id: 4
        name: Number of PV contributors
      - id: 5
        name: Centrality
    pre_axisids:
    pre_thname:
    pre_thpath:
  GenPromptD0:
    <<: *D0GenBase
    aliname: ["GenPrompt"]
    pre_axisids: [0, 5]
    pre_thname: hSparseGenPrompt
    pre_thpath: GenPrompt
  GenFDD0:
    <<: *D0GenBase
    aliname: ["GenFD"]
    pre_axisids: [0, 5]
    pre_thname: hSparseGenFD
    pre_thpath: GenFD
  # ----- Reco -------------------------------------------------------------------
  D0Rec: &D0RecBase
    name: D0Rec
    aliname: ["D0Rec"]
    cand: ["D0"]
    description: "hBdtScoreVsMassVsPtVsPtBVsYVsOriginVsD0Type — 11 axes"
    datatype: "MC"
    thname: hBdtScoreVsMassVsPtVsPtBVsYVsOriginVsD0Type
    thpath: hf-task-d0
    axes:
      - id: 0
        name: BDT score bkg.
      - id: 1
        name: BDT score non-prompt.
      - id: 2
        name: BDT score prompt.
      - id: 3
        name: inv. mass
      - id: 4
        name: pT
      - id: 5
        name: y
      - id: 6
        name: CandType
      - id: 7
        name: pT B
      - id: 8
        name: Origin
      - id: 9
        name: Number of PV contributors
      - id: 10
        name: Centrality
    pre_axisids:
    pre_thname:
    pre_thpath:
  RecoPromptD0:
    <<: *D0RecBase
    name: RecoPrompt
    aliname: ["RecoPromptD0"]
    pre_axisids: [0, 2, 3, 4, 10]
    pre_thname: hSparseRecoPrompt
    pre_thpath: RecoPrompt
  RecoFDD0:
    <<: *D0RecBase
    name: RecoFD
    aliname: ["RecoFDD0"]
    pre_axisids: [0, 2, 3, 4, 10]
    pre_thname: hSparseRecoFD
    pre_thpath: RecoFD
  RecoReflD0:
    <<: *D0RecBase
    name: RecoRefl
    aliname: ["RecoReflD0"]
    pre_axisids: [0, 2, 3, 4, 10]
    pre_thname: hSparseRecoRefl
    pre_thpath: RecoRefl

# ─── task flow ─────────────────────────────────────────────────────────────────
flow:
    name: FlowSP
    aliname: [flow, FlowSP]
    cand: ["D0", "Dplus", "Dstar"]
    description: "hSparseFlowCharm — 12 axes (inv mass, pT, cent, SP, scores, event flags)"
    datatype: "DATA"
    thname: hSparseFlowCharm
    thpath: hf-task-flow-charm-hadrons
    axes:
      - id: 0
        name: Inv. mass
      - id: 1
        name: pT
      - id: 2
        name: Centrality
      - id: 3
        name: Sp
      - id: 4
        name: Bkg score
      - id: 5
        name: FD score
      - id: 6
        name: OccupancyITS
      - id: 7
        name: NoSameBunchPileup
      - id: 8
        name: Occupancy
      - id: 9
        name: NoCollInTimeRangeNarrow
      - id: 10
        name: NoCollInTimeRangeStandard
      - id: 11
        name: NoCollInRofStandard
    pre_axisids: [0, 1, 2, 3, 4, 5]
    pre_thname: hSparseFlowSP
    pre_thpath: FlowSP